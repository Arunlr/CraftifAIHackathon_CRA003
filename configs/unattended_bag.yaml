# Unattended Bag Sentinel - metro / railway concourse
project: "Unattended Bag Sentinel"
subtitle: "Metro concourse cam | bag left alone | PipeGen + TensorRT"
source: stdin
stream: {width: 1920, height: 1080}
anchor: bottom_center
min_confidence: 0.3
zones:
  concourse: [[0.0, 0.35], [1.0, 0.35], [1.0, 1.0], [0.0, 1.0]]
rules:
  - name: unattended_bag
    type: unattended
    zone: concourse
    classes: [suitcase, backpack, handbag]
    owner_classes: [person]
    seconds: 10            # demo value; use 60-120 s in production
    radius: 0.12           # owner must stay within this distance (0..1 units)
    severity: critical
    message: "UNATTENDED {class} #{track_id} for {seconds}s - send security"
  - name: concourse_crowd
    type: count_threshold
    zone: concourse
    classes: [person]
    levels: {warning: 25, critical: 40}
perf: {model: "YOLOv8s COCO-80 + tracker", precision: "FP16 vs INT8", fps: "fill", latency_ms: "fill", power_w: "fill"}

actuator:
  hold_seconds: 8          # how long a one-shot alert keeps the siren/LED on
sinks:
  console: true
  jsonl: true              # run/events.jsonl
  mqtt: {enabled: false, host: localhost, port: 1883, topic_prefix: alerts}   # alerts/<rule> + retained alerts/state
  telegram: {enabled: false, min_interval: 20}   # needs env TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
  serial: {enabled: false, port: COM3, baud: 115200}   # ESP32 running firmgen/ESP32_alert_PRD.md firmware
